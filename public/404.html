<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ashva Finserv</title>
  <script>
    // GitHub Pages doesn't support client-side routing natively.
    // This stashes the requested path and redirects to index.html,
    // which restores it via history.replaceState before React mounts.
    // This file is static (not processed by Vite), so the base path below
    // must be kept in sync by hand with `base` in vite.config.js.
    var basePath = '/ashvafinserv.com/';
    var path = location.pathname + location.search + location.hash;
    sessionStorage.setItem('spa-redirect', path);
    location.replace(basePath);
  </script>
</head>
<body></body>
</html>
